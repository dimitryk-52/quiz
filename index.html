<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f16">
<title>Квиз</title>
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="css/style.css">
<!-- Оформления игр. Каждый файл включается своим data-skin на <html>
     и без него не делает ничего, поэтому подключены всегда. Какое
     оформление показать, решает поле theme идущей игры (выбирается
     в хабе при создании) — ставит атрибут app.js. -->
<link rel="stylesheet" href="css/by.css">
<!-- Тема и оформление выставляются до первой отрисовки: иначе телефон
     успевает мигнуть тёмным экраном при светлой теме, а на белорусском
     квизе — ещё и стандартной страницей, пока идёт запрос к базе.
     По умолчанию тёмная — квиз играется в полутёмном зале.

     Оформление здесь берётся из прошлого сеанса и потому лишь
     предположение; настоящее придёт с конфигурацией игры, и app.js
     поправит атрибут. Поэтому же имя проверяем регулярным выражением:
     в localStorage может лежать что угодно. -->
<script>
  try {
    var t = localStorage.getItem('quiz.theme');
    document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';

    var s = localStorage.getItem('quiz.skin');
    if (s && s !== 'standard' && /^[a-z][a-z0-9-]{0,19}$/.test(s)) {
      document.documentElement.dataset.skin = s;
    }

    // Цвет строки состояния берём из --bg, а не списком литералов:
    // иначе он врёт при каждой смене и палитры, и оформления.
    var m = document.querySelector('meta[name="theme-color"]');
    var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    if (m && bg) m.content = bg;
  } catch (e) { /* localStorage заблокирован — остаёмся на тёмной */ }
</script>
</head>
<body>

<header class="top">
  <img class="logo" src="img/logo.png" alt="Логотип квиза">

  <!-- Раунд — главное, что игрок должен считывать с экрана: центр и крупно.
       Под ним название раунда («МЕТАЛЛ»): ведущий объявляет тему голосом,
       и на экране она должна совпадать с услышанным.
       Названия игры в шапке нет: на весь квиз оно одно, места занимает
       столько же, сколько название раунда, а меняется название раунда. -->
  <div class="round-box">
    <div class="round" id="round-label">РАУНД —</div>
    <div class="round-name" id="round-name" hidden></div>
  </div>

  <div class="top-right">
    <button class="theme-btn" id="theme-toggle" type="button"
            title="Переключить тему" aria-label="Переключить тему"></button>
    <div class="link" id="link-indicator" data-state="offline">нет связи</div>
  </div>
</header>

<main class="wrap">

  <!-- Блок команды: обычное состояние -->
  <section class="team-view" id="team-view" hidden>
    <span class="team-name" id="team-name"></span>
    <button class="team-edit" id="team-edit" type="button" aria-label="Изменить команду">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
      </svg>
    </button>
  </section>

  <!-- Блок команды: первый вход / переименование / переключение -->
  <section class="team-edit-screen" id="team-edit-screen" hidden>
    <h2 class="team-edit-title" id="team-edit-title">Название команды</h2>

    <!-- Крупно показываем, какая команда правится: страховка от того,
         чтобы случайно не переименовать соперника -->
    <div class="team-edit-current" id="team-edit-current" hidden></div>

    <div class="team-edit-row">
      <input class="team-input" id="team-input" type="text"
             placeholder="Введите название команды"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn" id="team-submit" type="button">ОК</button>
    </div>

    <div class="team-error" id="team-error"></div>
    <button class="btn-ghost" id="team-cancel" type="button" hidden>Отмена</button>

    <div class="team-list-hint" id="team-list-hint"></div>
    <div class="team-list" id="team-list"></div>
  </section>

  <div class="state-note" id="state-note" hidden>Ожидайте…</div>

  <section class="questions" id="questions"></section>

</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
